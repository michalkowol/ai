<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FAF9F5">
  <title>Claude sessions</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <style>
    :root {
      --ivory:    #FAF9F5;
      --slate:    #141413;
      --clay:     #D97757;
      --oat:      #E3DACC;
      --olive:    #788C5D;
      --gray-150: #F0EEE6;
      --gray-300: #D1CFC5;
      --gray-500: #87867F;
      --gray-700: #3D3D3A;
      --white:    #FFFFFF;

      --serif: ui-serif, Georgia, 'Times New Roman', serif;
      --sans:  system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      --mono:  ui-monospace, 'SF Mono', Menlo, Monaco, monospace;

      color-scheme: light;
    }

    :root[data-theme="dark"] {
      --ivory:    #1A1A18;  /* page background, and text on clay/olive/slate */
      --slate:    #F5F4EE;  /* headings and emphasis, so light here */
      --clay:     #D97757;
      --oat:      #4A4437;
      --olive:    #7E9264;
      --gray-150: #2C2C28;
      --gray-300: #3B3B35;
      --gray-500: #9C9B92;
      --gray-700: #D6D4CB;
      --white:    #22221F;  /* card and tile surfaces */

      color-scheme: dark;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--sans);
      background: var(--ivory);
      color: var(--gray-700);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    code {
      font-family: var(--mono);
      font-size: 0.92em;
      background: var(--gray-150);
      padding: 1px 6px;
      border-radius: 4px;
    }

    h1, h2, h3 {
      font-family: var(--serif);
      font-weight: 500;
      color: var(--slate);
      letter-spacing: -0.01em;
    }

    h1 { font-size: 38px; line-height: 1.15; }
    h2 { font-size: 24px; line-height: 1.2; }
    h3 { font-size: 18px; line-height: 1.3; }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--gray-500);
    }

    .pill {
      display: inline-block;
      font-family: var(--mono);
      font-size: 11.5px;
      background: var(--gray-150);
      border: 1.5px solid var(--gray-300);
      color: var(--gray-700);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .pill.waiting { background: var(--clay); border-color: var(--clay); color: var(--ivory); }
    .pill.busy    { background: var(--olive); border-color: var(--olive); color: var(--ivory); }
    .pill.shell   { background: var(--oat); border-color: var(--oat); color: var(--slate); }
    .pill.idle    { background: transparent; border-color: var(--clay); color: var(--clay); }

    .tag {
      display: inline-block;
      font-family: var(--mono);
      font-size: 11px;
      background: var(--oat);
      color: var(--slate);
      padding: 2px 8px;
      border-radius: 6px;
    }

    button.btn {
      font-family: var(--sans);
      font-size: 14px;
      padding: 9px 16px;
      border-radius: 10px;
      border: 1.5px solid var(--gray-300);
      background: var(--white);
      color: var(--slate);
      cursor: pointer;
    }

    button.btn:disabled { opacity: 0.5; cursor: default; }

    /* toggle buttons reflect a persistent setting: a dot shows the current state at a glance */
    button.btn.toggle { position: relative; padding-left: 26px; }
    button.btn.toggle::before {
      content: '';
      position: absolute;
      left: 10px;
      top: 50%;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gray-300);
      transform: translateY(-50%);
    }
    button.btn.toggle[data-mode="on"]::before,
    button.btn.toggle[data-mode="loop"]::before { background: var(--olive); }

    .wrap { max-width: 1100px; margin: 0 auto; padding: 48px 32px 96px; }

    .top { display: flex; flex-wrap: wrap; gap: 24px; margin-bottom: 28px; }
    .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 14px; flex-basis: 100%; }
    .hint { font-size: 13px; color: var(--gray-500); }

    .banner {
      background: var(--clay);
      color: var(--ivory);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 32px; }
    .kpi { background: var(--white); border: 1.5px solid var(--gray-300); border-radius: 12px; padding: 14px 18px; }
    .kpi .value { font-size: 28px; font-weight: 600; color: var(--slate); line-height: 1.2; }
    .kpi.accent .value { color: var(--clay); }
    .kpi .label { font-size: 13px; color: var(--gray-500); margin-top: 2px; }

    .card {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) minmax(0, 2fr) 220px;
      gap: 20px;
      background: var(--white);
      border: 1.5px solid var(--gray-300);
      border-left: 5px solid var(--gray-300);
      border-radius: 12px;
      padding: 18px 20px;
      margin-bottom: 14px;
    }
    .card.waiting { border-left-color: var(--clay); animation: attention 2s ease-in-out infinite; }
    .card.busy    { border-left-color: var(--olive); }
    .card.shell   { border-left-color: var(--oat); }
    .card.idle    { border-left-color: var(--clay); animation: attention 2s ease-in-out infinite; }

    @keyframes attention {
      0%, 100% { box-shadow: 0 0 0 0 rgba(217, 119, 87, 0); }
      50%      { box-shadow: 0 0 0 5px rgba(217, 119, 87, 0.45); }
    }

    @media (prefers-reduced-motion: reduce) {
      .card.waiting, .card.idle { animation: none; box-shadow: 0 0 0 3px rgba(217, 119, 87, 0.35); }
    }

    .card.waiting, .card.idle { cursor: pointer; }
    .card.acked { animation: none; box-shadow: none; }

    .card .title { margin: 10px 0 6px; overflow-wrap: anywhere; }
    .card .meta { font-family: var(--mono); font-size: 12px; color: var(--gray-500); overflow-wrap: anywhere; }
    .card .since { font-size: 12.5px; color: var(--gray-500); margin-left: 8px; }
    .card .plan { margin-left: 6px; }

    .field { margin-bottom: 10px; font-size: 14px; overflow-wrap: anywhere; }
    .field .eyebrow { display: block; margin-bottom: 2px; }
    .field.now { color: var(--slate); }
    .tool { font-family: var(--mono); font-size: 12.5px; }
    .tool .tag { margin-right: 4px; }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; align-content: start; }
    .stats strong { display: block; font-size: 15px; font-weight: 600; color: var(--slate); }
    .stats span { font-size: 12px; color: var(--gray-500); }

    .ended h2 { margin: 40px 0 14px; }
    .row {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) 80px 80px 130px;
      gap: 14px;
      align-items: baseline;
      padding: 10px 0;
      border-bottom: 1.5px solid var(--gray-300);
      font-size: 14px;
    }
    .row .mono { font-family: var(--mono); font-size: 12.5px; color: var(--gray-500); overflow-wrap: anywhere; }
    .row .num { font-variant-numeric: tabular-nums; text-align: right; }

    .empty { color: var(--gray-500); padding: 24px 0; }
    .foot { margin-top: 28px; font-size: 13px; color: var(--gray-500); }

    .alarm {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      background: #E5484D;
      opacity: 0;
    }
    :root[data-alarm="on"]   .alarm { animation: alarm 900ms ease-in-out 1; }
    :root[data-alarm="loop"] .alarm { animation: alarm 900ms ease-in-out infinite; }

    @keyframes alarm {
      0%, 100% { opacity: 0.05; }
      50%      { opacity: 0.5; }
    }

    @media (prefers-reduced-motion: reduce) {
      :root[data-alarm="on"]   .alarm { animation: none; opacity: 0; }
      :root[data-alarm="loop"] .alarm { animation: none; opacity: 0.3; }
    }

    :root[data-compact="on"] .card {
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: baseline;
      gap: 4px 14px;
      padding: 9px 14px;
      margin-bottom: 6px;
    }
    :root[data-compact="on"] .card > :first-child {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 3px 8px;
      min-width: 0;
    }
    :root[data-compact="on"] .card > :nth-child(2) { grid-column: 1 / -1; }
    :root[data-compact="on"] .card h3 { font-size: 15px; }
    :root[data-compact="on"] .card .since,
    :root[data-compact="on"] .card .plan { margin-left: 0; }
    :root[data-compact="on"] .card .hash { display: none; }
    :root[data-compact="on"] .card .title,
    :root[data-compact="on"] .card .meta,
    :root[data-compact="on"] .field.now {
      margin: 0;
      min-width: 0;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    :root[data-compact="on"] .card .meta { flex: 1 1 auto; font-size: 11.5px; }
    :root[data-compact="on"] .field:not(.now) { display: none; }
    :root[data-compact="on"] .field .eyebrow { display: inline; margin: 0 6px 0 0; }
    :root[data-compact="on"] .stats { display: flex; justify-content: flex-end; gap: 12px; }
    :root[data-compact="on"] .stats > div { display: none; }
    :root[data-compact="on"] .stats > div:first-child,
    :root[data-compact="on"] .stats > div.cost,
    :root[data-compact="on"] .stats > div.tokens { display: block; }
    :root[data-compact="on"] .stats strong { display: inline; font-size: 12.5px; font-weight: 500; }
    :root[data-compact="on"] .stats span { display: inline; margin-left: 5px; }

    @media (max-width: 860px) {
      .card { grid-template-columns: 1fr; }
      .stats { grid-template-columns: repeat(3, 1fr); }
      .row { grid-template-columns: 1fr 1fr; }
      .row .num { text-align: left; }
    }
  </style>
  <script>
    (() => {
      let stored = null;
      try { stored = JSON.parse(localStorage.getItem('theme')); } catch (error) {}
      const dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      try {
        if (JSON.parse(localStorage.getItem('compact'))) document.documentElement.dataset.compact = 'on';
      } catch (error) {}
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <div class="eyebrow" style="margin-bottom: 10px;">Claude Code · refreshes every 3 s · <span id="updated">connecting</span></div>
        <h1>Sessions</h1>
      </div>
      <div class="controls">
        <button class="btn toggle" id="notifyBtn"></button>
        <span class="hint" id="notifyDenied" hidden>Notifications are blocked for this site in the browser settings</span>
        <button class="btn toggle" id="alarmBtn"></button>
        <button class="btn toggle" id="soundBtn"></button>
        <button class="btn" id="themeBtn"></button>
        <button class="btn" id="compactBtn"></button>
      </div>
    </header>

    <div class="banner" id="banner" hidden>Connection to the dashboard server lost, retrying every 3 s</div>

    <section class="kpis" id="kpis"></section>
    <section id="live"></section>
    <section class="ended" id="ended"></section>
    <footer class="foot" id="foot"></footer>
  </div>

  <div class="alarm" aria-hidden="true"></div>

  <script>
    (() => {
      const POLL_MS = 3000;
      const FETCH_TIMEOUT_MS = 8000;
      const PULSE_MS = 2000;  // duration of the `attention` keyframes; a re-rendered card resumes mid-cycle
      const STATUS_LABEL = { waiting: 'Needs input', busy: 'Working', idle: 'Waiting for prompt', shell: 'In shell', ended: 'Ended' };
      const ESTIMATE_NOTE = 'Estimated from the token usage in the transcript, subagent calls are not counted';

      const el = id => document.getElementById(id);
      const load = (key, fallback) => {
        try {
          const value = localStorage.getItem(key);
          return value === null ? fallback : JSON.parse(value);
        } catch (error) {
          return fallback;
        }
      };
      const save = (key, value) => {
        try { localStorage.setItem(key, JSON.stringify(value)); } catch (error) {}
      };

      const state = {
        firstPoll: true,
        inFlight: false,
        timer: null,
        notified: load('notified', {}),
        acked: load('acked', {}),
        flash: load('flash', 'off'),
        notify: load('notify', true),
        sound: load('sound', 'on'),
        sessions: []
      };
      const siren = { context: null, played: false, timer: null };
      const MODE_CYCLE = ['off', 'on', 'loop'];
      const nextMode = mode => MODE_CYCLE[(MODE_CYCLE.indexOf(mode) + 1) % MODE_CYCLE.length];
      const SOUND_LABEL = { off: 'Sound off', on: 'Sound on', loop: 'Sound on (loop)' };
      const FLASH_LABEL = { off: 'Flash off', on: 'Flash on', loop: 'Flash on (loop)' };

      const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const basename = path => path ? path.replace(/\/+$/, '').split('/').pop() : '';
      const truncate = (text, max) => {
        text = String(text ?? '');
        return text.length > max ? text.slice(0, max - 1) + '…' : text;
      };

      function fmtDuration(ms) {
        if (ms == null || Number.isNaN(ms) || ms < 0) return '–';
        const s = Math.round(ms / 1000);
        if (s < 60) return s + ' s';
        const m = Math.floor(s / 60);
        if (m < 60) return m + ' min';
        const h = Math.floor(m / 60);
        if (h < 24) return h + ' h ' + (m % 60) + ' min';
        return Math.floor(h / 24) + ' d ' + (h % 24) + ' h';
      }
      const fmtAgo = (ms, now) => ms ? fmtDuration(now - ms) + ' ago' : '–';
      const fmtTime = ms => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const fmtCost = usd => usd == null ? '–' : '$' + usd.toFixed(2);
      function fmtTokens(count) {
        if (count == null) return '–';
        if (count < 1000) return String(count);
        const [value, unit] = count < 1000000 ? [count / 1000, 'k'] : [count / 1000000, 'M'];
        return (value < 10 ? value.toFixed(1) : Math.round(value)) + unit;
      }
      const fmtSince = ms => ms >= 3600000 ? Math.round(ms / 3600000) + ' h' : Math.round(ms / 60000) + ' min';

      // Claude Code writes its own cost only at exit and at a context compaction, so a live session gets the
      // higher of that checkpoint and the tokens seen so far: both are lower bounds of what it has spent.
      function sessionCost(session) {
        const transcript = session.transcript || {};
        return Math.max((transcript.cost || {}).usd || 0, transcript.estimatedCostUSD || 0);
      }

      function usageInfo(session) {
        const transcript = session.transcript || {};
        const reported = (transcript.cost || {}).usd;
        const estimate = transcript.estimatedCostUSD;
        const estimated = session.live && estimate != null;
        return {
          cost: estimated ? '~' + fmtCost(Math.max(estimate, reported ?? 0)) : fmtCost(reported),
          costTitle: estimated ? ESTIMATE_NOTE : '',
          tokens: transcript.estimatedTokens == null ? '–' : '~' + fmtTokens(transcript.estimatedTokens),
          tokensTitle: ESTIMATE_NOTE
        };
      }

      const ackKey = session => session.statusUpdatedAt || 0;

      function newestPending(session) {
        const pending = (session.transcript || {}).pendingTools || [];
        return pending.length ? pending[pending.length - 1] : null;
      }

      function nowText(session) {
        const transcript = session.transcript || {};
        const tool = newestPending(session);
        const toolText = tool ? tool.name + ' · ' + tool.summary : '';
        switch (session.status) {
          case 'waiting': return [session.needs || session.waitingFor || 'input needed', toolText].filter(Boolean).join(' · ');
          case 'busy': return toolText || 'Thinking';
          case 'idle': return transcript.lastAssistantText || 'Waiting for your next prompt';
          case 'shell': return 'Shell escape open in the terminal';
          default: return transcript.lastAssistantText || '';
        }
      }

      function tile(label, value, accent) {
        return `<div class="kpi${accent ? ' accent' : ''}"><div class="value">${value}</div><div class="label">${esc(label)}</div></div>`;
      }

      function card(session, now) {
        const transcript = session.transcript || {};
        const spend = usageInfo(session);
        const run = session.run || {};
        const subagents = (transcript.pendingTools || []).filter(tool => tool.name === 'Agent').length;
        const meta = [
          transcript.branch,
          basename(run.worktree),
          transcript.model || run.model,
          transcript.effort,
          session.startedAt ? 'started ' + fmtTime(session.startedAt) : null
        ].filter(Boolean).join(' · ');
        const recent = (transcript.recentTools || []).slice().reverse()
          .map(tool => `<div class="tool"><span class="tag">${esc(tool.name)}</span>${esc(truncate(tool.summary, 70))}</div>`).join('');
        const acked = state.acked[session.sessionId] === ackKey(session);
        return `
          <article class="card ${esc(session.status)}${acked ? ' acked' : ''}" style="animation-delay: ${-(now % PULSE_MS)}ms" data-session="${esc(session.sessionId)}" data-status-at="${ackKey(session)}">
            <div>
              <span class="pill ${esc(session.status)}">${esc(STATUS_LABEL[session.status] || session.status)}</span>
              ${session.statusUpdatedAt ? `<span class="since">for ${fmtDuration(now - session.statusUpdatedAt)}</span>` : ''}
              ${transcript.permissionMode === 'plan' ? '<span class="tag plan">plan</span>' : ''}
              <h3 class="title">${esc(session.title)}</h3>
              <div class="meta">${esc(meta)}<span class="hash"> · ${esc(session.sessionId.slice(0, 8))}</span></div>
            </div>
            <div>
              <div class="field now"><span class="eyebrow">Now</span>${esc(truncate(nowText(session), 220))}</div>
              ${transcript.lastPrompt ? `<div class="field"><span class="eyebrow">Last prompt</span>${esc(truncate(transcript.lastPrompt, 180))}</div>` : ''}
              ${recent ? `<div class="field"><span class="eyebrow">Recent tools</span>${recent}</div>` : ''}
            </div>
            <div class="stats">
              <div><strong>${session.startedAt ? fmtDuration(now - session.startedAt) : '–'}</strong><span>elapsed</span></div>
              <div><strong>${transcript.turns ?? '–'}</strong><span>turns</span></div>
              <div><strong>${transcript.lastTurnDurationMs != null ? fmtDuration(transcript.lastTurnDurationMs) : '–'}</strong><span>last turn</span></div>
              <div><strong>${subagents}</strong><span>subagents running</span></div>
              <div><strong>${fmtAgo(session.lastActivityAt, now)}</strong><span>last activity</span></div>
              <div class="cost"${spend.costTitle ? ` title="${esc(spend.costTitle)}"` : ''}><strong>${esc(spend.cost)}</strong><span>cost</span></div>
              <div class="tokens" title="${esc(spend.tokensTitle)}"><strong>${esc(spend.tokens)}</strong><span>tokens</span></div>
            </div>
          </article>`;
      }

      function row(session, now) {
        const transcript = session.transcript || {};
        return `
          <div class="row">
            <div>${esc(session.title)}</div>
            <div class="mono">${esc([transcript.branch, transcript.model].filter(Boolean).join(' · '))}</div>
            <div class="num">${transcript.turns ?? '–'} turns</div>
            <div class="num">${fmtCost((transcript.cost || {}).usd)}</div>
            <div class="mono">${esc(fmtAgo(session.lastActivityAt, now))}</div>
          </div>`;
      }

      function render(data) {
        const now = data.now;
        const live = data.sessions.filter(session => session.live);
        const ended = data.sessions.filter(session => !session.live);
        const count = status => live.filter(session => session.status === status).length;
        state.acked = Object.fromEntries(live
          .filter(session => state.acked[session.sessionId] === ackKey(session))
          .map(session => [session.sessionId, ackKey(session)]));
        save('acked', state.acked);
        const waiting = count('waiting');
        const free = count('idle') + count('shell');
        const endedCost = ended.reduce((total, session) => total + sessionCost(session), 0);
        el('kpis').innerHTML =
          tile('Needs input', waiting, waiting > 0) +
          tile('Working', count('busy'), false) +
          tile('Waiting for prompt', free, free > 0) +
          tile('Ended in the last ' + fmtSince(data.sinceMs) + ' · ~' + fmtCost(endedCost), ended.length, false);
        el('live').innerHTML = live.length
          ? live.map(session => card(session, now)).join('')
          : '<p class="empty">No live Claude sessions. Start one with <code>ai</code>.</p>';
        el('ended').innerHTML = ended.length ? '<h2>Ended recently</h2>' + ended.map(session => row(session, now)).join('') : '';
        el('foot').textContent = data.runsWithoutSession ? data.runsWithoutSession + ' container(s) running without a Claude session' : '';
        el('updated').textContent = 'updated ' + new Date(now).toLocaleTimeString();
        document.title = (waiting ? '(' + waiting + ') ' : '') + 'Claude sessions';
        state.sessions = data.sessions;
        refreshAlarm();
      }

      const canNotify = () => state.notify && 'Notification' in window && Notification.permission === 'granted';

      function show(title, body, tag) {
        const notification = new Notification(title, { body, tag });
        notification.onclick = () => { window.focus(); notification.close(); };
      }

      function notify(data) {
        const notified = {};
        for (const session of data.sessions) {
          if (!session.live) continue;
          const known = Boolean(state.notified[session.sessionId]);
          const previous = state.notified[session.sessionId] || {};
          const current = { waiting: previous.waiting, idle: previous.idle };
          if (session.status === 'waiting' && session.statusUpdatedAt && previous.waiting !== session.statusUpdatedAt) {
            current.waiting = session.statusUpdatedAt;
            if (canNotify()) show('Needs input · ' + session.title, truncate(nowText(session), 160), session.sessionId);
          }
          if (session.status === 'idle' && session.statusUpdatedAt && previous.idle !== session.statusUpdatedAt) {
            current.idle = session.statusUpdatedAt;
            if (canNotify() && known && !state.firstPoll) show('Finished · ' + session.title, truncate(nowText(session), 160), session.sessionId);
          }
          notified[session.sessionId] = current;
        }
        state.notified = notified;
        save('notified', notified);
      }

      function openSiren() {
        const Context = window.AudioContext || window.webkitAudioContext;
        if (!siren.context && Context) siren.context = new Context();
        // Browsers start the context suspended until the page has seen a user gesture.
        if (siren.context && siren.context.state === 'suspended') siren.context.resume().catch(() => {});
      }

      function tone(context, { at, frequency, slideTo, duration, type = 'sine', peak = 0.08, attack = 0.02 }) {
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.type = type;
        oscillator.frequency.setValueAtTime(frequency, at);
        if (slideTo) oscillator.frequency.exponentialRampToValueAtTime(slideTo, at + duration);
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.linearRampToValueAtTime(peak, at + attack);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + duration);
        oscillator.connect(gain).connect(context.destination);
        oscillator.start(at);
        oscillator.stop(at + duration + 0.05);
      }

      // Two low sonar pings, the Nostromo's idle bridge chatter.
      function nostromo(context, at) {
        tone(context, { at, frequency: 220, duration: 0.9, peak: 0.07 });
        tone(context, { at: at + 0.55, frequency: 165, duration: 1.2, peak: 0.055 });
      }

      function play() {
        const context = siren.context;
        if (!context || context.state !== 'running') return;
        nostromo(context, context.currentTime + 0.02);
      }

      const SOUND_INTERVAL = 6000;

      function stopSiren() {
        siren.played = false;
        clearInterval(siren.timer);
        siren.timer = null;
      }

      function needsAttention(session) {
        return session.live && (session.status === 'waiting' || session.status === 'idle');
      }

      function refreshAlarm() {
        const alerting = state.sessions.some(session =>
          needsAttention(session) && state.acked[session.sessionId] !== ackKey(session));
        document.documentElement.dataset.alarm = alerting ? state.flash : 'off';

        if (!alerting || state.sound === 'off') {
          stopSiren();
          return;
        }
        openSiren();
        if (state.sound === 'loop') {
          if (!siren.timer) {
            play();
            siren.timer = setInterval(play, SOUND_INTERVAL);
          }
        } else {
          clearInterval(siren.timer);
          siren.timer = null;
          if (!siren.played) {
            play();
            siren.played = true;
          }
        }
      }

      function setFlash(mode) {
        state.flash = mode;
        el('alarmBtn').textContent = FLASH_LABEL[mode];
        el('alarmBtn').dataset.mode = mode;
        refreshAlarm();
      }

      function setSound(mode) {
        state.sound = mode;
        el('soundBtn').textContent = SOUND_LABEL[mode];
        el('soundBtn').dataset.mode = mode;
        if (mode === 'off') stopSiren(); else openSiren();
        refreshAlarm();
      }

      async function poll() {
        if (state.inFlight) return;
        state.inFlight = true;
        clearTimeout(state.timer);
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
        try {
          const response = await fetch('/api/sessions', { signal: controller.signal, cache: 'no-store' });
          if (!response.ok) throw new Error('HTTP ' + response.status);
          const data = await response.json();
          render(data);
          notify(data);
          state.firstPoll = false;
          el('banner').hidden = true;
        } catch (error) {
          el('banner').hidden = false;
        } finally {
          clearTimeout(timeout);
          state.inFlight = false;
          state.timer = setTimeout(poll, POLL_MS);
        }
      }

      function syncNotifyUi() {
        const supported = 'Notification' in window;
        const denied = supported && Notification.permission === 'denied';
        el('notifyBtn').hidden = !supported;
        el('notifyBtn').disabled = denied;
        el('notifyBtn').textContent = canNotify() ? 'Notifications on' : 'Notifications off';
        el('notifyBtn').dataset.mode = canNotify() ? 'on' : 'off';
        el('notifyDenied').hidden = !denied;
      }

      function setTheme(theme) {
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = getComputedStyle(document.documentElement).getPropertyValue('--ivory').trim();
        el('themeBtn').textContent = theme === 'dark' ? 'Light mode' : 'Dark mode';
      }

      function setCompact(compact) {
        if (compact) {
          document.documentElement.dataset.compact = 'on';
        } else {
          delete document.documentElement.dataset.compact;
        }
        el('compactBtn').textContent = compact ? 'Full view' : 'Compact view';
      }

      el('compactBtn').addEventListener('click', () => {
        const compact = document.documentElement.dataset.compact !== 'on';
        save('compact', compact);
        setCompact(compact);
      });

      el('themeBtn').addEventListener('click', () => {
        const theme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        save('theme', theme);
        setTheme(theme);
      });
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
        if (!load('theme', null)) {
          setTheme(event.matches ? 'dark' : 'light');
        }
      });

      el('notifyBtn').addEventListener('click', async () => {
        if (canNotify()) {
          state.notify = false;
        } else {
          if (Notification.permission === 'default') {
            try { await Notification.requestPermission(); } catch (error) {}
          }
          state.notify = Notification.permission === 'granted';
        }
        save('notify', state.notify);
        syncNotifyUi();
      });
      el('alarmBtn').addEventListener('click', () => {
        const mode = nextMode(state.flash);
        save('flash', mode);
        setFlash(mode);
      });
      el('soundBtn').addEventListener('click', () => {
        const mode = nextMode(state.sound);
        save('sound', mode);
        setSound(mode);
        if (mode !== 'off') play();
      });
      // The alarm only has to catch the eye: any click anywhere says it did, until the next thing comes up.
      addEventListener('click', () => {
        let acked = false;
        for (const session of state.sessions) {
          if (session.live && state.acked[session.sessionId] !== ackKey(session)) {
            state.acked[session.sessionId] = ackKey(session);
            acked = true;
          }
        }
        if (!acked) return;
        save('acked', state.acked);
        for (const card of el('live').children) card.classList.add('acked');
        refreshAlarm();
      });
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') poll();
      });

      const unlockSiren = () => {
        if (state.sound === 'off') return;
        openSiren();
        removeEventListener('pointerdown', unlockSiren);
      };
      addEventListener('pointerdown', unlockSiren);

      setTheme(document.documentElement.dataset.theme);
      setCompact(document.documentElement.dataset.compact === 'on');
      setFlash(state.flash);
      setSound(state.sound);
      syncNotifyUi();
      poll();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
    })();
  </script>
</body>
</html>
